services:
  db:
    image: postgres:16-alpine
    container_name: paypal_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paypal
      POSTGRES_PASSWORD: paypal
      POSTGRES_DB: paypal_analytics
    ports:
      - "5432:5432"
    volumes:
      - paypal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypal -d paypal_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paypal_pgdata: